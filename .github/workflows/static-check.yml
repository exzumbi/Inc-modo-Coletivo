name: Validate static site
on:
  push:
    branches: [producao-cloudflare-pages]
  pull_request:
    branches: [producao-cloudflare-pages]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run test:worker
